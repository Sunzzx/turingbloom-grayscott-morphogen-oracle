[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "turingbloom-grayscott-morphogen-oracle"
version = "0.1.0"
description = "Gray–Scott reaction–diffusion Turing morphogenesis oracle: Pearson pattern atlas, FTCS PDE solver, linear stability/dispersion, ANSI live demo"
authors = [{name = "Sunzzx & Hermes AI"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
]
keywords = [
    "gray-scott",
    "reaction-diffusion",
    "turing-patterns",
    "morphogenesis",
    "pearson-atlas",
    "developmental-biology",
    "pde",
    "pattern-formation",
    "computational-biology",
    "self-organization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.urls]
Homepage = "https://github.com/Sunzzx/turingbloom-grayscott-morphogen-oracle"
Repository = "https://github.com/Sunzzx/turingbloom-grayscott-morphogen-oracle"
Issues = "https://github.com/Sunzzx/turingbloom-grayscott-morphogen-oracle/issues"
Sponsor = "https://github.com/sponsors/Sunzzx"
License-Commercial = "https://buy.stripe.com/test_turingbloom_enterprise"
Documentation = "https://github.com/Sunzzx/turingbloom-grayscott-morphogen-oracle#readme"

[project.scripts]
turingbloom = "turingbloom.demo:main"
turingbloom-demo = "turingbloom.demo:main"
grayscott = "turingbloom.demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["turingbloom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
